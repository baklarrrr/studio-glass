<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="Bakar Studio">
  <meta name="description" content="Bakar Studio is now inside Bakar Home. This address opens Bakar Home.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <title>Bakar Home</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body { margin:0; height:100%; background:#000; color:#f3f6f4; font:24px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { box-sizing:border-box; min-height:100%; max-width:600px; margin:0 auto; padding:32px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:24px; }
    p { margin:0; font-size:26px; font-weight:650; white-space:nowrap; }
    a { display:inline-block; min-height:56px; box-sizing:border-box; padding:12px 24px; border:2px solid #56655d; border-radius:14px; color:#8bdbb6; font-size:26px; font-weight:650; text-decoration:none; }
    a:focus { outline:3px solid #8bdbb6; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <p id="moved">Bakar Studio is now inside Bakar Home.</p>
    <a id="go" href="../glass-home/#tab=review&amp;view=renders" role="button" autofocus>Open Bakar Home</a>
  </main>
  <script>
    // The whole app moved into Bakar Home (Review: Pictures, Feedback, Renders). An old registration or a link from the
    // PC still lands here, so this page passes it on. A pairing arrives only in the fragment (#t=…&k=…), which no server
    // sees; it is handed to Bakar Home in its fragment and is never stored, logged or put in a query here.
    (function () {
      var go = document.getElementById('go');
      var target = new URL('../glass-home/', location.href);
      var from = new URLSearchParams(location.hash.slice(1));
      var to = new URLSearchParams();
      var t = from.get('t'), k = from.get('k');
      if (t && k) to.set('sg', t + '~' + k);
      from.forEach(function (value, name) { if (name !== 't' && name !== 'k' && !to.has(name)) to.set(name, value); });
      if (!to.has('tab')) to.set('tab', 'review');
      if (!to.has('view')) to.set('view', 'renders'); // Studio opened on render progress; so does this.
      target.search = '';
      target.hash = to.toString();
      go.href = target.href;
      go.addEventListener('keydown', function (event) { if (event.key === ' ') { event.preventDefault(); go.click(); } });
      // The PC sidebar keeps its own page.
      if (window.STUDIO_LOCAL) { location.replace('local.html' + location.hash); return; }
      // Replaces the old offline copy of the app on these glasses.
      try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* optional */ }
      if (!window.__holdForward) location.replace(target.href);
      else go.focus();
    })();
  </script>
</body>
</html>
